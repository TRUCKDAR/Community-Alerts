server:
  port: 8082

spring:
  application:
    name: ms-community-alerts

  datasource:
    # Fuera de Docker (IDE/tests) la conexión es directa y el esquema va en currentSchema (public: tipos PostGIS).
    # En Docker se pasa por PgBouncer y el search_path lo fija el rol del servicio.
    url: jdbc:postgresql://localhost:5432/truckcar_db?currentSchema=community_alerts,public
    username: ${DB_USER:truckcar_admin}
    # Sin valor por defecto: fuera de Docker se define DB_PASSWORD (en el CI, el de su PostgreSQL efímero).
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway (db/migration); Hibernate solo comprueba que coincida con las entidades.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Esquema propio del servicio (rol y esquema creados por db-init); el historial de Flyway vive en él.
    schemas: community_alerts
    default-schema: community_alerts
    # En una base existente (tablas creadas por Hibernate) la línea base es 0, así V1 (idempotente) sí se aplica
    # y crea los índices espaciales; con la línea base por defecto (1) se omitiría.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

truckcar:
  kafka:
    topic:
      road-alerts: ${TRUCKCAR_ROAD_ALERTS_TOPIC:truckcar.events.road-alerts}
      # Botón SOS: tópico de alta prioridad (Notifications y torre de control).
      sos: ${TRUCKCAR_SOS_TOPIC:truckcar.events.sos}
  outbox:
    publish-interval-ms: ${TRUCKCAR_OUTBOX_PUBLISH_INTERVAL_MS:1000}
    batch-size: ${TRUCKCAR_OUTBOX_BATCH_SIZE:100}
  alerts:
    dedup:
      radius-meters: ${TRUCKCAR_ALERT_DEDUP_RADIUS_METERS:500}
      window-minutes: ${TRUCKCAR_ALERT_DEDUP_WINDOW_MINUTES:30}
    validation-threshold: ${TRUCKCAR_ALERT_VALIDATION_THRESHOLD:3}
    ttl:
      default-hours: ${TRUCKCAR_ALERT_TTL_DEFAULT_HOURS:24}
      derrumbe-hours: ${TRUCKCAR_ALERT_TTL_DERRUMBE_HOURS:6}
# ── Observabilidad ──────────────────────────────────────────────────────────────────────────────
# /actuator/prometheus solo es accesible dentro de la red interna: el api-gateway no enruta /actuator/**.
# Las trazas se exportan por OTLP al otel-collector cuando se define MANAGEMENT_OTLP_TRACING_ENDPOINT (en Docker,
# http://otel-collector:4318/v1/traces); sin ella no se exporta nada.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRUCKCAR_TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      # X-Correlation-Id (lo genera el api-gateway) viaja como cabecera propia en HTTP y en Kafka y se copia al MDC.
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id

logging:
  # [servicio,traceId,spanId] en cada línea de log y, en las peticiones que lo traen, el X-Correlation-Id.
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] [cid=%X{X-Correlation-Id:-}] "

server:
  port: 8082

spring:
  application:
    name: ms-community-alerts

  datasource:
    url: jdbc:postgresql://localhost:5432/truckcar_db
    username: truckcar_admin
    password: truckcar_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # truckcar_db es compartida: historial propio para no mezclar versiones con otros servicios.
    table: flyway_schema_history_community_alerts
    # En una base existente (tablas creadas por Hibernate) la línea base es 0, así V1 (idempotente) sí se aplica
    # y crea los índices espaciales; con la línea base por defecto (1) se omitiría.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

truckcar:
  kafka:
    topic:
      road-alerts: ${TRUCKCAR_ROAD_ALERTS_TOPIC:truckcar.events.road-alerts}
  outbox:
    publish-interval-ms: ${TRUCKCAR_OUTBOX_PUBLISH_INTERVAL_MS:1000}
    batch-size: ${TRUCKCAR_OUTBOX_BATCH_SIZE:100}
  alerts:
    dedup:
      radius-meters: ${TRUCKCAR_ALERT_DEDUP_RADIUS_METERS:500}
      window-minutes: ${TRUCKCAR_ALERT_DEDUP_WINDOW_MINUTES:30}
    validation-threshold: ${TRUCKCAR_ALERT_VALIDATION_THRESHOLD:3}
    ttl:
      default-hours: ${TRUCKCAR_ALERT_TTL_DEFAULT_HOURS:24}
      derrumbe-hours: ${TRUCKCAR_ALERT_TTL_DERRUMBE_HOURS:6}